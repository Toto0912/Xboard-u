# Clash Premium 2023.08.17 订阅模板
mixed-port: 33333
ipv6: false
allow-lan: true
bind-address: '*'
mode: rule
log-level: silent
external-controller: 127.0.0.1:9090

# Premium 的 TLS SNI 嗅探
experimental:
  sniff-tls-sni: true

tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true
  auto-detect-interface: true

dns:
  enable: true
  ipv6: true
  enhanced-mode: fake-ip
  fake-ip-range: '198.18.0.1/16'
  use-hosts: false

  # 这些域名使用真实 DNS 答复
  fake-ip-filter:
    - '+.lan'
    - '+.local'
    - '+.home.arpa'
    - '+.localhost'
    - 'localhost.ptlogin2.qq.com'

  default-nameserver:
    - '119.29.29.29'
    - '223.5.5.5'

  # Premium 直连这些上游 DNS
  nameserver:
    - 'tls://8.8.4.4'
    - 'tls://1.0.0.1'

# 订阅生成器填入节点和两个测速组的成员
proxies: []

proxy-groups:
  - name: '节点选择'
    type: select
    proxies:
      - '自动选择'
      - '故障转移'
      - DIRECT

  - name: '自动选择'
    type: url-test
    proxies: []
    url: 'https://www.google.com/generate_204'
    interval: 180
    tolerance: 150

  - name: '故障转移'
    type: fallback
    proxies: []
    url: 'https://www.google.com/generate_204'
    interval: 180

  - name: '漏网之鱼'
    type: select
    proxies:
      - '节点选择'
      - DIRECT

rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.list'
    path: ./ruleset/reject.list
    interval: 86400

  applications:
    type: http
    behavior: classical
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/applications.list'
    path: ./ruleset/applications.list
    interval: 86400

  direct:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.list'
    path: ./ruleset/direct.list
    interval: 86400

  proxy:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.list'
    path: ./ruleset/proxy.list
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.list'
    path: ./ruleset/lancidr.list
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.list'
    path: ./ruleset/cncidr.list
    interval: 86400

# 拒绝尚未匹配直连规则的 UDP 443 连接
script:
  engine: expr
  shortcuts:
    quic: network == 'udp' and dst_port == 443

rules:
  - 'RULE-SET,applications,DIRECT'
  - 'RULE-SET,direct,DIRECT'
  - 'RULE-SET,lancidr,DIRECT,no-resolve'
  - 'RULE-SET,cncidr,DIRECT,no-resolve'
  - 'GEOIP,cn,DIRECT,no-resolve'
  - 'RULE-SET,reject,REJECT'
  - 'SCRIPT,quic,REJECT,no-resolve'
  - 'RULE-SET,proxy,节点选择'
  - 'MATCH,漏网之鱼'
