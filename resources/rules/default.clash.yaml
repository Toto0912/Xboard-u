mixed-port: 33333
ipv6: true
allow-lan: true
bind-address: '*'
mode: rule
log-level: silent
external-controller: 127.0.0.1:9090

# 原版 Premium 的 TLS SNI 嗅探选项
experimental:
  sniff-tls-sni: true

# TUN 配置
tun:
  enable: true
  stack: gvisor
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true
  auto-detect-interface: true

# DNS：保持 Real-IP 模式
dns:
  enable: true
  ipv6: true
  enhanced-mode: redir-host
  use-hosts: false

  default-nameserver:
    - '119.29.29.29'
    - '223.5.5.5'

  # 原版上游 DNS 直接连接
  nameserver:
    - 'tls://8.8.4.4'
    - 'tls://1.0.0.1'

proxies: []

proxy-groups:
  - name: '节点选择'
    type: select
    proxies:
      - '自动选择'
      - '故障转移'
      - DIRECT

  - name: '自动选择'
    type: url-test
    proxies: []
    url: 'https://www.google.com/generate_204'
    interval: 180
    tolerance: 150

  - name: '故障转移'
    type: fallback
    proxies: []
    url: 'https://www.google.com/generate_204'
    interval: 180

  - name: '漏网之鱼'
    type: select
    proxies:
      - '节点选择'
      - DIRECT

rule-providers:
  reject:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/ads.list'
    path: ./ruleset/reject.list
    interval: 86400

  applications:
    type: http
    behavior: classical
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/applications.list'
    path: ./ruleset/applications.list
    interval: 86400

  direct:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cn.list'
    path: ./ruleset/direct.list
    interval: 86400

  proxy:
    type: http
    behavior: domain
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/proxy.list'
    path: ./ruleset/proxy.list
    interval: 86400

  lancidr:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/privateip.list'
    path: ./ruleset/lancidr.list
    interval: 86400

  cncidr:
    type: http
    behavior: ipcidr
    format: text
    url: 'https://cdn.jsdelivr.net/gh/DustinWin/ruleset_geodata@mihomo-ruleset/cnip.list'
    path: ./ruleset/cncidr.list
    interval: 86400
    
# 用 Premium 脚本快捷规则保留 UDP 443 拦截条件
script:
  engine: expr
  shortcuts:
    quic: network == 'udp' and dst_port == 443

rules:
  - 'RULE-SET,applications,DIRECT'
  - 'RULE-SET,direct,DIRECT'
  - 'RULE-SET,lancidr,DIRECT,no-resolve'
  - 'RULE-SET,cncidr,DIRECT,no-resolve'
  - 'GEOIP,cn,DIRECT,no-resolve'
  - 'SCRIPT,quic,REJECT,no-resolve'
  - 'RULE-SET,proxy,节点选择'
  - 'MATCH,漏网之鱼'