mixed-port: 33333
ipv6: true
allow-lan: true
bind-address: '*'
mode: rule
log-level: silent
external-controller: 127.0.0.1:9090
unified-delay: true
keep-alive-idle: 60
keep-alive-interval: 10
keep-alive-probes: 3
geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geoip.dat'
  geosite: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/v2ray-rules-dat@release/geosite.dat'
sniffer:
  enable: true
  sniff:
    TLS:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
# ================= 1. TUN 模式配置 =================
tun:
  enable: true
  mtu: 1420
  stack: gvisor
  dns-hijack:
    - 'any:53'
    - 'tcp://any:53'
  auto-route: true              # 自动设置全局路由，接管系统流量
  strict-route: true
  auto-detect-interface: true   # 自动检测出网网卡，防止流量环路
  route-exclude-address:
    - 192.168.0.0/16
    - fc00::/7

# ================= 2. DNS 精准分流配置 =================
# 默认走远程代理 DNS，国内/私有域名走本地本地 DNS
dns:
  enable: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.0/15
  fake-ip-range6: 2001:2::/48

  fake-ip-filter-mode: rule
  fake-ip-filter:
    # 复用已有的直连域名规则集
    - 'RULE-SET,applications,real-ip'
    - 'RULE-SET,direct,real-ip'

    # 本地域名返回真实解析结果
    - 'DOMAIN-SUFFIX,lan,real-ip'
    - 'DOMAIN-SUFFIX,local,real-ip'
    - 'DOMAIN-SUFFIX,localdomain,real-ip'
    - 'DOMAIN-SUFFIX,localhost,real-ip'
    - 'DOMAIN-SUFFIX,home.arpa,real-ip'

    # 其余域名返回 Fake-IP
    - 'MATCH,fake-ip'
  use-hosts: false
  use-system-hosts: false

  default-nameserver:
    - '119.29.29.29'
    - '223.5.5.5'

  proxy-server-nameserver:
    - '119.29.29.29'

  # 默认 DNS
  nameserver:
    - 'tls://8.8.4.4#节点选择'
    - 'tls://1.0.0.1#节点选择'

  # DNS 策略分流
  nameserver-policy:
    'rule-set:applications,direct':
      - '119.29.29.29'
      - '223.5.5.5'
    'rule-set:proxy': 
      - 'tls://8.8.8.8#节点选择'
      - 'tls://1.1.1.1#节点选择'

# ================= 3. 策略组配置 =================
proxies:

proxy-groups:
  - { name: '节点选择', type: select, proxies: ['自动选择', '故障转移', 'DIRECT'] }
  - { name: '自动选择', type: url-test, proxies: [], url: 'https://www.google.com/generate_204', interval: 180, tolerance: 150 }
  - { name: '故障转移', type: fallback, proxies: [], url: 'https://www.google.com/generate_204', interval: 180 }
  - { name: '漏网之鱼', type: select, proxies: ['节点选择', 'DIRECT'] }

# ================= 4. 精准分流规则 =================
rule-providers:
  reject:
    type: http
    behavior: domain
    url: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/reject.txt'
    path: ./ruleset/reject.yaml
    interval: 86400
  applications:
    type: http
    behavior: classical
    url: "https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/applications.txt"
    path: ./ruleset/applications.yaml
    interval: 86400
  direct:
    type: http
    behavior: domain
    url: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/direct.txt'
    path: ./ruleset/direct.yaml
    interval: 86400
  proxy:
    type: http
    behavior: domain
    url: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/proxy.txt'
    path: ./ruleset/proxy.yaml
    interval: 86400
  lancidr:
    type: http
    behavior: ipcidr
    url: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/lancidr.txt'
    path: ./ruleset/lancidr.yaml
    interval: 86400
  cncidr:
    type: http
    behavior: ipcidr
    url: 'https://cdn.jsdelivr.net/gh/Loyalsoldier/clash-rules@release/cncidr.txt'
    path: ./ruleset/cncidr.yaml
    interval: 86400

rules:
  - 'RULE-SET,applications,DIRECT'
  - 'RULE-SET,direct,DIRECT'
  - 'RULE-SET,lancidr,DIRECT,no-resolve'
  - 'RULE-SET,cncidr,DIRECT,no-resolve'
  - 'GEOIP,cn,DIRECT,no-resolve'
  - 'AND,((DST-PORT,443),(NETWORK,UDP)),REJECT'
  - 'RULE-SET,proxy,节点选择'
  - 'GEOSITE,geolocation-!cn,节点选择'
  - 'MATCH,漏网之鱼'