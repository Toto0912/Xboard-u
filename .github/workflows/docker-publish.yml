name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/test.yml
  release:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Package tracked source and deployment files
        run: python3 scripts/package-release.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/toto0912/xboard-u:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Toto0912/Xboard-u
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Smoke test published image
        env:
          RELEASE_IMAGE: ghcr.io/toto0912/xboard-u:${{ github.ref_name }}
        run: bash scripts/smoke-release.sh "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/panel-smoke"
      - name: Promote validated stable image
        run: docker buildx imagetools create --tag ghcr.io/toto0912/xboard-u:latest "ghcr.io/toto0912/xboard-u:$GITHUB_REF_NAME"
      - name: Publish formal GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets/"* --title "xboard-u $GITHUB_REF_NAME" --notes-file "docs/releases/$GITHUB_REF_NAME.md" --verify-tag --latest
