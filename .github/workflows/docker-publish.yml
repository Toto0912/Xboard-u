name: Publish release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/test.yml
  release:
    needs: validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Determine release status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          if [[ -f "$notes" ]]; then
            prerelease=false
            if grep -qi '^<!-- *prerelease *-->' "$notes"; then prerelease=true; fi
          else
            # A reissued version can keep its notes on the existing GitHub Release.
            prerelease=$(gh release view "$GITHUB_REF_NAME" --json isPrerelease --jq '.isPrerelease')
          fi
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=true; fi
          echo "PRERELEASE=$prerelease" >> "$GITHUB_ENV"
      - name: Package tracked source and deployment files
        run: python3 scripts/package-release.py "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish both architectures
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/toto0912/xboard-u:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/Toto0912/Xboard-u
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
      - name: Smoke test published image
        env:
          RELEASE_IMAGE: ghcr.io/toto0912/xboard-u:${{ github.ref_name }}
        run: bash scripts/smoke-release.sh "$RUNNER_TEMP/release-assets" "$RUNNER_TEMP/panel-smoke"
      - name: Promote validated stable image
        if: env.PRERELEASE == 'false'
        run: |
          docker buildx imagetools create --tag ghcr.io/toto0912/xboard-u:latest "ghcr.io/toto0912/xboard-u:$GITHUB_REF_NAME"
      - name: Publish or update formal GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="docs/releases/$GITHUB_REF_NAME.md"
          release_flags=(--latest --prerelease=false)
          if [[ "$PRERELEASE" == true ]]; then
            release_flags=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets/"* --clobber
            if [[ -f "$notes" ]]; then
              gh release edit "$GITHUB_REF_NAME" --title "xboard-u $GITHUB_REF_NAME" --notes-file "$notes" "${release_flags[@]}"
            fi
          else
            gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release-assets/"* --title "xboard-u $GITHUB_REF_NAME" --notes-file "$notes" --verify-tag "${release_flags[@]}"
          fi
