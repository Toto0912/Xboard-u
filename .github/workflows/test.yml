name: Panel regression tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin-frontend/package-lock.json
      - run: npm --prefix admin-frontend ci && npm --prefix admin-frontend run typecheck && npm --prefix admin-frontend run build:public
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: bcmath, curl, dom, mbstring, pdo_sqlite, redis, sockets, zip
          coverage: none
          tools: composer
      - run: composer install --no-interaction --prefer-dist --no-progress --no-security-blocking
      - run: mkdir -p bootstrap/cache storage/framework/cache/data storage/framework/sessions storage/framework/views && touch database/database.sqlite
      - run: vendor/bin/phpunit
      - run: bash -n install.sh && python3 scripts/test-release-installer.py
